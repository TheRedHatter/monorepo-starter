name: Scan with Detekt

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '25 23 * * 5'
  workflow_dispatch:

env:
  # Fallback version if "latest" cannot be resolved
  DETEKT_FALLBACK_TAG: v1.23.8

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Fetch latest Detekt release version (with fallback)
    - name: Get latest Detekt release
      id: detekt_version
      run: |
        latest=$(curl -s https://api.github.com/repos/detekt/detekt/releases/latest | jq -r .tag_name)
        if [ -z "$latest" ] || [ "$latest" == "null" ]; then
          echo "⚠️ Failed to fetch latest release. Falling back to $DETEKT_FALLBACK_TAG"
          latest=$DETEKT_FALLBACK_TAG
        fi
        echo "tag=$latest" >> $GITHUB_OUTPUT

    # Setup Detekt with resolved version
    - name: Setup Detekt
      run: |
        dest=$(mktemp -d)
        version=${{ steps.detekt_version.outputs.tag }}
        echo "📥 Downloading Detekt $version"
        curl -sSL \
          -o $dest/detekt.jar \
          https://github.com/detekt/detekt/releases/download/$version/detekt-cli-${version#v}-all.jar
        echo "java -jar $dest/detekt.jar" > $dest/detekt
        chmod +x $dest/detekt
        echo $dest >> $GITHUB_PATH

    # Run Detekt and generate SARIF output (never fails CI)
    - name: Run Detekt
      run: |
        detekt --input ${{ github.workspace }} \
               --report sarif:${{ github.workspace }}/detekt.sarif.json || true

    # Ensure SARIF file always exists (even if Detekt crashes)
    - name: Ensure SARIF exists
      run: |
        if [ ! -s "${{ github.workspace }}/detekt.sarif.json" ]; then
          echo '{"version":"2.1.0","runs":[]}' > ${{ github.workspace }}/detekt.sarif.json
        fi

    # Make SARIF artifact locations relative
    - name: Make artifact location URIs relative
      run: |
        echo "$(
          jq \
            --arg github_workspace ${{ github.workspace }} \
            '. | ( .runs[].results[].locations[].physicalLocation.artifactLocation.uri |= if test($github_workspace) then .[($github_workspace | length | . + 1):] else . end )' \
            ${{ github.workspace }}/detekt.sarif.json
        )" > ${{ github.workspace }}/detekt.sarif.json

    # Upload SARIF to GitHub Code Scanning
    - uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ github.workspace }}/detekt.sarif.json
        checkout_path: ${{ github.workspace }}
