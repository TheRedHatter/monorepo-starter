name: Detekt Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  detekt:
    runs-on: ubuntu-latest

    env:
      DETEKT_FALLBACK_TAG: v1.23.8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Detekt (latest with fallback)
        run: |
          set -e
          dest=$(mktemp -d)
          latest_tag=$(curl -s https://api.github.com/repos/detekt/detekt/releases/latest | jq -r .tag_name || echo "")
          if [ -z "$latest_tag" ] || [ "$latest_tag" == "null" ]; then
            echo "⚠️ Could not fetch latest tag, falling back to $DETEKT_FALLBACK_TAG"
            latest_tag=$DETEKT_FALLBACK_TAG
          fi
          curl -sSL \
            "https://github.com/detekt/detekt/releases/download/$latest_tag/detekt" \
            -o "$dest/detekt" || {
              echo "⚠️ Failed to download Detekt $latest_tag, falling back to $DETEKT_FALLBACK_TAG"
              curl -sSL \
                "https://github.com/detekt/detekt/releases/download/$DETEKT_FALLBACK_TAG/detekt" \
                -o "$dest/detekt"
            }
          chmod +x "$dest/detekt"
          echo "$dest" >> $GITHUB_PATH

      - name: Run Detekt on all modules
        continue-on-error: true
        run: |
          mkdir -p reports
          # find all source roots (modules containing kotlin files)
          modules=$(find . -name "build.gradle*" -exec dirname {} \; | sort -u)
          echo "📦 Detected modules:"
          echo "$modules"

          # run detekt for each module and merge sarif
          run_index=0
          echo '{"version":"2.1.0","runs":[]}' > reports/detekt.merged.json
          for m in $modules; do
            echo "▶️ Running Detekt on $m"
            detekt --input "$m" --report sarif:reports/detekt.$run_index.json || true
            if [ -s reports/detekt.$run_index.json ]; then
              jq -s '.[0].runs += .[1].runs | .[0]' reports/detekt.merged.json reports/detekt.$run_index.json > reports/tmp.json
              mv reports/tmp.json reports/detekt.merged.json
            fi
            run_index=$((run_index+1))
          done

      - name: Ensure valid SARIF
        if: always()
        run: |
          if [ -f reports/detekt.merged.json ]; then
            cp reports/detekt.merged.json reports/detekt.fixed.json
          else
            echo '{"version":"2.1.0","runs":[]}' > reports/detekt.fixed.json
          fi

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/detekt.fixed.json
