name: Detekt Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  detekt:
    runs-on: ubuntu-latest

    env:
      DETEKT_FALLBACK_TAG: v1.23.8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Detekt (latest with fallback)
        id: detekt-download
        run: |
          set -e
          dest=$(mktemp -d)
          latest_tag=$(curl -s https://api.github.com/repos/detekt/detekt/releases/latest | jq -r .tag_name || echo "")
          if [ -z "$latest_tag" ] || [ "$latest_tag" == "null" ]; then
            echo "⚠️ Could not fetch latest tag, falling back to $DETEKT_FALLBACK_TAG"
            latest_tag=$DETEKT_FALLBACK_TAG
          fi
          curl -sSL \
            "https://github.com/detekt/detekt/releases/download/$latest_tag/detekt" \
            -o "$dest/detekt" || {
              echo "⚠️ Failed to download Detekt $latest_tag, falling back to $DETEKT_FALLBACK_TAG"
              curl -sSL \
                "https://github.com/detekt/detekt/releases/download/$DETEKT_FALLBACK_TAG/detekt" \
                -o "$dest/detekt"
            }
          chmod +x "$dest/detekt"
          echo "$dest" >> $GITHUB_PATH

      - name: Run Detekt
        continue-on-error: true
        run: |
          mkdir -p reports
          detekt \
            --input mono-jvm \
            --report sarif:reports/detekt.sarif.json || true

      - name: Fix SARIF paths (optional)
        if: always()
        run: |
          if [ -f reports/detekt.sarif.json ]; then
            jq \
              --arg github_workspace "$GITHUB_WORKSPACE" \
              '.runs[].results[].locations[].physicalLocation.artifactLocation.uri |= if test($github_workspace) then .[($github_workspace | length + 1):] else . end' \
              reports/detekt.sarif.json > reports/detekt.fixed.json || cp reports/detekt.sarif.json reports/detekt.fixed.json
          else
            echo '{"version":"2.1.0","runs":[]}' > reports/detekt.fixed.json
          fi

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/detekt.fixed.json
